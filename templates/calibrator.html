<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calibrador UAILLE</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #1c1e21; }
        .video-container { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
        .video-box { border: 1px solid #dddfe2; padding: 10px; border-radius: 8px; background-color: #f7f7f7; }
        .video-box h2 { margin-top: 0; font-size: 1.2em; }
        .video-box img { display: block; width: 100%; max-width: 420px; background-color: #000; cursor: crosshair; border-radius: 4px; }
        .controls { margin-top: 20px; padding: 20px; background-color: #f7f7f7; border-radius: 8px; }
        .control-group { margin-bottom: 20px; text-align: center; }
        label { font-weight: 600; color: #606770; }
        input[type="range"] { width: 80%; vertical-align: middle; }
        #hsv-display { font-size: 1.5em; color: #0056b3; font-weight: bold; min-height: 30px; }
        #threshold-value { font-size: 1.2em; color: #1c1e21; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calibrador do UAILEE</h1>

        <div class="video-container">
            <div class="video-box">
                <h2>Câmera ao Vivo</h2>
                <img id="raw-video" src="{{ url_for('video_feed') }}" alt="Raw Video Feed">
            </div>
            <div class="video-box">
                <h2>Imagem Processada (Threshold)</h2>
                <img src="{{ url_for('processed_feed') }}" alt="Processed Video Feed">
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <h2>Ajuste de Threshold</h2>
                <label for="threshold">Valor: <span id="threshold-value">{{ current_threshold }}</span></label>
                <br>
                <input type="range" id="threshold" min="0" max="255" value="{{ current_threshold }}">
            </div>
            <hr>
            <div class="control-group">
                <h2>Valor da Cor (HSV)</h2>
                <p>Clique na imagem da "Câmera ao Vivo" para obter o valor HSV do pixel.</p>
                <div id="hsv-display">H: -, S: -, V: -</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const rawVideo = document.getElementById('raw-video');
            const hsvDisplay = document.getElementById('hsv-display');
            const thresholdSlider = document.getElementById('threshold');
            const thresholdValueSpan = document.getElementById('threshold-value');

            // Evento para obter a cor ao clicar no vídeo
            rawVideo.addEventListener('click', (event) => {
                const rect = rawVideo.getBoundingClientRect();
                const x = Math.floor(event.offsetX * (rawVideo.naturalWidth / rect.width));
                const y = Math.floor(event.offsetY * (rawVideo.naturalHeight / rect.height));

                fetch('/get_hsv', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ x: x, y: y })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.error) {
                        hsvDisplay.textContent = `Erro: ${data.error}`;
                    } else {
                        hsvDisplay.innerHTML = `H: ${data.h}, S: ${data.s}, V: ${data.v}`;
                    }
                });
            });

            // Evento para atualizar o threshold ao mover o slider
            thresholdSlider.addEventListener('input', () => {
                const newThreshold = thresholdSlider.value;
                thresholdValueSpan.textContent = newThreshold;

                fetch('/update_threshold', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ threshold: newThreshold })
                });
            });
        });
    </script>
</body>
</html>
